name: Disposable exact decoding revision retest
on:
  push:
    branches: [michaelabatetsu-render-free-feasibility]
    paths:
      - ".github/workflows/memory-revision-retest.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Build exact requested decoding revision
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 0541653da46672892e1146d1fbdb3b77ba85b6a5
          mkdir "$RUNNER_TEMP/pinned-source"
          git archive 0541653da46672892e1146d1fbdb3b77ba85b6a5 | tar -x -C "$RUNNER_TEMP/pinned-source"
          docker build -t choplab:render-free "$RUNNER_TEMP/pinned-source"
      - name: Measure original-limit workflow and liveness
        timeout-minutes: 30
        run: |
          python3 -m py_compile .github/benchmarks/render_free.py
          sudo timeout --signal=TERM --kill-after=15s 1750s \
            python3 -u .github/benchmarks/render_free.py \
            "$RUNNER_TEMP/memory-revision-retest" --original-limit --import-diagnostic --memory-revision-retest
      - name: Make benchmark evidence readable
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/memory-revision-retest"; then
            sudo find "$RUNNER_TEMP/memory-revision-retest" -type f -exec chmod 644 {} +
          fi
      - name: Preserve exact operation and memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-revision-retest
          path: |
            ${{ runner.temp }}/memory-revision-retest/*.json
            ${{ runner.temp }}/memory-revision-retest/*.jsonl
            ${{ runner.temp }}/memory-revision-retest/*.log
          retention-days: 7
