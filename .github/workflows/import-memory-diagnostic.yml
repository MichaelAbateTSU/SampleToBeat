name: Disposable twenty-minute memory diagnostic
on:
  push:
    branches: [michaelabatetsu-render-free-feasibility]
    paths:
      - ".github/workflows/import-memory-diagnostic.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned current hosting revision
        run: |
          set -euo pipefail
          git fetch --depth=1 origin ece9072e17e0ec5a40ffe337d80fb179f426cfcd
          mkdir "$RUNNER_TEMP/pinned-source"
          git archive ece9072e17e0ec5a40ffe337d80fb179f426cfcd | tar -x -C "$RUNNER_TEMP/pinned-source"
          docker build -t choplab:render-free "$RUNNER_TEMP/pinned-source"
      - name: Sample original-duration import memory without app modifications
        timeout-minutes: 12
        run: |
          python3 -m py_compile .github/benchmarks/render_free.py
          sudo timeout --signal=TERM --kill-after=15s 700s \
            python3 -u .github/benchmarks/render_free.py \
            "$RUNNER_TEMP/import-diagnostic" --original-limit --import-diagnostic
      - name: Make benchmark evidence readable
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/import-diagnostic"; then
            sudo find "$RUNNER_TEMP/import-diagnostic" -type f -exec chmod 644 {} +
          fi
      - name: Preserve memory samples and stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-memory-diagnostic
          path: |
            ${{ runner.temp }}/import-diagnostic/*.json
            ${{ runner.temp }}/import-diagnostic/*.jsonl
            ${{ runner.temp }}/import-diagnostic/*.log
          retention-days: 7
