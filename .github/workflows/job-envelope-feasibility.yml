name: Disposable audio job envelope
on:
  push:
    branches: [michaelabatetsu-render-free-feasibility]
    paths:
      - ".github/workflows/job-envelope-feasibility.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build unchanged pinned container
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 4d62d58a6ba64f2f8efe642777ba3c057fcc8e64
          mkdir "$RUNNER_TEMP/pinned-source"
          git archive 4d62d58a6ba64f2f8efe642777ba3c057fcc8e64 | tar -x -C "$RUNNER_TEMP/pinned-source"
          docker build -t choplab:render-free "$RUNNER_TEMP/pinned-source"
      - name: Measure synthetic workflows at 2 GiB and 2 vCPU
        timeout-minutes: 27
        run: |
          python3 -m py_compile .github/benchmarks/render_free.py
          sudo timeout --signal=TERM --kill-after=15s 1500s \
            python3 -u .github/benchmarks/render_free.py \
            "$RUNNER_TEMP/job-envelope-results" --job-envelope
      - name: Make benchmark evidence readable
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/job-envelope-results"; then
            sudo find "$RUNNER_TEMP/job-envelope-results" -type f -exec chmod 644 {} +
          fi
      - name: Preserve exact measurements and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-job-envelope
          path: |
            ${{ runner.temp }}/job-envelope-results/*.json
            ${{ runner.temp }}/job-envelope-results/*.log
          retention-days: 7
