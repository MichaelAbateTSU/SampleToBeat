name: Isolated decoder expansion checks
on:
  push:
    branches: [michaelabatetsu-render-free-feasibility]
    paths:
      - "backend/src/choplab/disk_decode.py"
      - "backend/tests/test_disk_decode.py"
      - ".github/benchmarks/*disk_decode*"
      - ".github/benchmarks/Dockerfile.disk-decode*"
      - ".github/workflows/disk-decode.yml"
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build prerequisite image with isolated helper overlay
        run: |
          set -euo pipefail
          git fetch --depth=1 origin e42630a486045cfcbabc579a36b1829b59d0685d
          mkdir "$RUNNER_TEMP/base"
          git archive e42630a486045cfcbabc579a36b1829b59d0685d | tar -x -C "$RUNNER_TEMP/base"
          docker build -t choplab:decode-base "$RUNNER_TEMP/base"
          docker build -t choplab:disk-decode -f .github/benchmarks/Dockerfile.disk-decode .
      - name: Independent original SciPy and FFmpeg parity and cleanup
        timeout-minutes: 5
        run: docker run --rm choplab:disk-decode -m pytest -q -p no:cacheprovider /checks/test_disk_decode.py
      - name: Capped original-duration low-rate decoding
        timeout-minutes: 20
        run: |
          sudo timeout --signal=TERM --kill-after=15s 1160s python3 \
            .github/benchmarks/measure_disk_decode.py "$RUNNER_TEMP/decode-low" 1 2 1200
      - name: Capped original-duration normal-rate decoding
        timeout-minutes: 7
        run: |
          sudo timeout --signal=TERM --kill-after=15s 400s python3 \
            .github/benchmarks/measure_disk_decode.py "$RUNNER_TEMP/decode-normal" 48000 2 1200
      - name: Capped coprime multichannel decoding
        timeout-minutes: 5
        run: |
          sudo timeout --signal=TERM --kill-after=15s 280s python3 \
            .github/benchmarks/measure_disk_decode.py "$RUNNER_TEMP/decode-coprime" 47999 128 4
      - name: Readable evidence
        if: always()
        run: sudo find "$RUNNER_TEMP" -maxdepth 2 -path '*/decode-*/*' -type f -exec chmod 644 {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-expansion-evidence
          path: |
            ${{ runner.temp }}/decode-*/*.json
            ${{ runner.temp }}/decode-*/*.jsonl
            ${{ runner.temp }}/decode-*/*.log
          retention-days: 7
