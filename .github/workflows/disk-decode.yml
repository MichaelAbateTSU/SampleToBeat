name: Isolated bounded decoder checks
on:
  push:
    branches: [michaelabatetsu-render-free-feasibility]
    paths:
      - "backend/src/choplab/disk_decode.py"
      - "backend/tests/test_disk_decode.py"
      - ".github/benchmarks/*disk_decode*"
      - ".github/benchmarks/Dockerfile.disk-decode"
      - ".github/workflows/disk-decode.yml"
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build baseline image with isolated helper overlay
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 0541653da46672892e1146d1fbdb3b77ba85b6a5
          mkdir "$RUNNER_TEMP/base"
          git archive 0541653da46672892e1146d1fbdb3b77ba85b6a5 | tar -x -C "$RUNNER_TEMP/base"
          docker build -t choplab:decode-base "$RUNNER_TEMP/base"
          docker build -t choplab:disk-decode -f .github/benchmarks/Dockerfile.disk-decode .
      - name: Exact decoder parity and failure cleanup tests
        run: docker run --rm choplab:disk-decode -m pytest -q /checks/test_disk_decode.py
      - name: Original duration helper at Render Free limits
        timeout-minutes: 17
        run: |
          sudo timeout --signal=TERM --kill-after=15s 1000s \
            python3 .github/benchmarks/measure_disk_decode.py "$RUNNER_TEMP/disk-decode"
      - name: Make evidence readable
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/disk-decode"; then
            sudo find "$RUNNER_TEMP/disk-decode" -type f -exec chmod 644 {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-decode-evidence
          path: |
            ${{ runner.temp }}/disk-decode/*.json
            ${{ runner.temp }}/disk-decode/*.jsonl
            ${{ runner.temp }}/disk-decode/*.log
          retention-days: 7
