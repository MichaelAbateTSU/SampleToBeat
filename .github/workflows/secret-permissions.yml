name: Runtime secret permission checks
on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "scripts/verify_secret_permissions.py"
      - ".github/workflows/secret-permissions.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "scripts/verify_secret_permissions.py"
      - ".github/workflows/secret-permissions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build production image without secrets
        run: |
          python3 -m py_compile scripts/verify_secret_permissions.py
          docker build -t choplab:secret-check .
      - name: Check real runtime permissions and hosted startup
        run: python3 scripts/verify_secret_permissions.py choplab:secret-check
