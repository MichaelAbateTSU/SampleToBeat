name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: uv sync
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: cd frontend && npm ci && npm run build && npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: cd backend && uv sync
      - name: Full user journey in a browser
        run: |
          cd backend && CHOPLAB_BILLING=mock CHOPLAB_DATA=$RUNNER_TEMP/data uv run choplab &
          for i in $(seq 1 60); do curl -sf localhost:8765/api/health && break; sleep 1; done
          cd frontend && node e2e/smoke.mjs
