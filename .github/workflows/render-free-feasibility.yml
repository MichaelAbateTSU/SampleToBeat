name: Disposable Render Free feasibility
on:
  push:
    branches: [michaelabatetsu-render-free-feasibility]
    paths:
      - ".github/workflows/render-free-feasibility.yml"
      - ".github/benchmarks/render_free.py"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build the pinned pushed application, not the hosting integration
        run: |
          git archive 4d62d58a6ba64f2f8efe642777ba3c057fcc8e64 | tar -x -C "$RUNNER_TEMP"
          docker build -t choplab:render-free "$RUNNER_TEMP"
      - name: Measure real API operations with hard cgroup limits
        timeout-minutes: 28
        run: |
          python3 -m py_compile .github/benchmarks/render_free.py
          sudo timeout --signal=TERM --kill-after=15s 1600s \
            python3 -u .github/benchmarks/render_free.py "$RUNNER_TEMP/render-free-results"
      - name: Collect measurements even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-free-measurements
          path: ${{ runner.temp }}/render-free-results
          retention-days: 7
