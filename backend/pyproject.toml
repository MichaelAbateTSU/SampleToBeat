[project]
name = "choplab"
version = "0.1.0"
description = "ChopLab AI - local sample-based hip-hop beat generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.157.0",
    "imageio-ffmpeg>=0.6.0",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "pedalboard>=0.9.26",
    "pydantic>=2.14.1",
    "pyloudnorm>=0.2.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
separation = [
    "audio-separator[cpu]>=0.47",
    "audioread>=3.1.0",
]


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
